[build]
  # Only public/ is published. It is built from an explicit allowlist of browser
  # files (tools/build-site.js). Publishing the repository root, as this used to,
  # served every source file, including function code, to anyone who asked.
  command = "npm install && node tools/build-site.js"
  functions = "netlify/functions"
  publish = "public"

[build.environment]
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"

[functions]
  node_bundler = "nft"
  # The catalog, article index and gift collection allowlist live at the repo root
  # because both the browser and the functions read them. Bundle them explicitly.
  # deploy-context.json is generated by the build command from Netlify's CONTEXT
  # and tells each function which deploy context it was built for.
  included_files = ["data/**", "netlify/functions/lib/deploy-context.json"]

[functions.auth]
  timeout = 5

# Defence in depth for the static site: no framing, no MIME sniffing, no
# referrer leakage, and nothing from other origins. The page loads only its own
# scripts and talks only to its own functions.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

# No timeout override for the generate function. The previous custom 30s value
# left no headroom: a live run measured 29.03s. It now runs inside Netlify's
# standard synchronous execution limit.
